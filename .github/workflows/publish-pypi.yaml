name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15

      - name: Build from pyproject.toml
        run: | 
          python -m pip install build
          python -m build
      - name: Publish Build
        uses: pypa/gh-action-pypi-publish@release/v1
