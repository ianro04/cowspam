name: Monthly Herd # Writes silly_cow_test.sh result stats monthly

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch: 

permissions:
  contents: write # For pushes to repo

jobs:
  run-and-append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13' 
          cache: 'pip' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script and append output # Takes from current month/year for number of cows (max: 2000)
        run: |
          curr_interval=$(date +%B-%Y)
          curr_year=$(date +%Y)
          curr_month=$(date +%m | sed 's/^0*//')
          curr_query=$(( curr_year / curr_month ))
          
          if [ "$curr_query" -gt 2000 ]; then
            curr_query=2000
          fi
          
          curr_results=$(python silly_cow_test.py -a "$curr_query" | tail -n 3 | sed -e '/^[[:space:]]*$/d')
          curr_results=${curr_results/FINAL/$curr_interval}
          echo "$curr_results" >> monthly_herd_stats.log

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monthly_herd_stats.log
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: append monthly script output for $(date +%B-%Y)"
          git push
